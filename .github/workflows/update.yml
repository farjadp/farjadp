name: Update profile card

on:
  schedule:
    - cron: "17 5 * * *"      # every day, 05:17 UTC
  push:
    branches: [main]
    paths-ignore: ["*.svg", "cache/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Redraw the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a personal access token (scopes: read:user, repo) saved as the
          # PROFILE_TOKEN secret also counts private repos and private commits.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python today.py
      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/stats.json
          git diff --cached --quiet || git commit -m "Update profile card"
          git push
